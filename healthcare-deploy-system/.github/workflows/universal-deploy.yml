name: Universal Deploy

on:
  push:
    paths:
      - 'config/deploy-schema.json'
      - 'applications/**/deploy-config.json'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v3
      - id: set-matrix
        run: |
          echo "matrix=[{\"app\":\"patient-portal\"}]" >> $GITHUB_OUTPUT

  validate-configurations:
    runs-on: ubuntu-latest
    needs: detect-changes
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v3
      - name: Validate config
        run: |
          scripts/validate-config.py applications/${{ matrix.app }}/deploy-config.json
      - name: Security audit
        run: |
          scripts/security-audit.py applications/${{ matrix.app }}/deploy-config.json
      - name: Cost estimation
        run: |
          scripts/cost-estimator.py applications/${{ matrix.app }}/deploy-config.json

  build-and-test:
    runs-on: ubuntu-latest
    needs: validate-configurations
    steps:
      - uses: actions/checkout@v3
      - name: Run tests
        run: |
          scripts/run-tests.py

  deploy-infrastructure:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v3
      - name: Terraform init
        run: terraform -chdir=terraform init
      - name: Plan infrastructure
        run: |
          scripts/plan-infrastructure.py applications/patient-portal/deploy-config.json
      - name: Apply infrastructure
        run: |
          scripts/deploy-infrastructure.py

  deploy-application:
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    steps:
      - uses: actions/checkout@v3
      - name: Deploy app
        run: echo "Deploying application..."
      - name: Health checks
        run: scripts/health-checks.py

  post-deployment-validation:
    runs-on: ubuntu-latest
    needs: deploy-application
    steps:
      - uses: actions/checkout@v3
      - name: Comprehensive tests
        run: scripts/comprehensive-test.py
      - name: Update deployment state
        run: scripts/update-deployment-state.py
